# Builds the Windows .exe and the Debian/Ubuntu .deb.
# Run it by hand from the Actions tab to get them as artifacts, or push a tag like v0.1.0 to attach them to a release.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: Copy-Item target/release/md-preview.exe MD-Preview.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MD-Preview-windows
          path: MD-Preview.exe

  deb:
    runs-on: ubuntu-22.04 # oldest runner, so the package also installs on older releases
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo install cargo-deb --locked
      - run: cargo deb --locked
      - uses: actions/upload-artifact@v4
        with:
          name: MD-Preview-deb
          path: target/debian/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" MD-Preview.exe *.deb --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
